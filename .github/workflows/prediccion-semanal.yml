name: Prediccion F1 semanal

on:
  schedule:
    # Cada jueves a las 08:17 UTC (09:17 en Madrid en invierno, 10:17 en verano).
    - cron: "17 8 * * 4"
  workflow_dispatch:
    inputs:
      circuit:
        description: "Circuito (vacio = detectar el proximo GP automaticamente)"
        required: false
        default: ""

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNATTENDED: "1"
      OUTPUT_ONLY_GRID: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
      OPENROUTER_MAX_TOKENS: ${{ vars.OPENROUTER_MAX_TOKENS || '3200' }}
      WEB_USER: ${{ secrets.WEB_USER }}
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
      FANTASY_LOGIN_URL: ${{ secrets.FANTASY_LOGIN_URL }}
      FANTASY_PLAYER_ID: ${{ secrets.FANTASY_PLAYER_ID }}
      FANTASY_PLAYER_NAME: ${{ secrets.FANTASY_PLAYER_NAME }}
      FANTASY_PLAYER_ROLE: ${{ vars.FANTASY_PLAYER_ROLE || 'USER' }}
      FANTASY_PLAYER_COLOR: ${{ vars.FANTASY_PLAYER_COLOR || '#000000' }}
      FANTASY_RACE_ID: ${{ vars.FANTASY_RACE_ID }}
      FANTASY_LEAGUE_ID: ${{ secrets.FANTASY_LEAGUE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Generar prediccion
        env:
          CIRCUIT: ${{ github.event.inputs.circuit }}
        run: |
          set -o pipefail
          node index.js ${CIRCUIT:+"$CIRCUIT"} | tee prediccion.txt

      - name: Publicar resumen
        if: always()
        run: |
          {
            echo "## Prediccion F1"
            echo '```text'
            cat prediccion.txt 2>/dev/null || echo "Sin salida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediccion-${{ github.run_id }}
          path: prediccion.txt
          if-no-files-found: ignore
